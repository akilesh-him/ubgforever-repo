<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slipstream HTML editor</title><style>*{box-sizing:border-box}body{margin:0;background:#16121d;color:#fff;font:14px system-ui}header{display:flex;align-items:center;gap:16px;padding:16px;border-bottom:1px solid #ffffff20}header span{flex:1;color:#bcb1c2;font-size:12px}button{background:#ff8796;color:#21131b;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}main{display:grid;grid-template-columns:1fr 1fr;height:calc(100dvh - 70px)}textarea{resize:none;background:#1d1725;color:#f5dce5;border:0;padding:20px;font:14px/1.7 monospace;outline:none}iframe{background:white;border:0;width:100%;height:100%}@media(max-width:600px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}header span{display:none}}</style><header><b>HTML editor</b><span>Saved on this device · preview is sandboxed</span><button id="run">Run preview</button><button id="download">Download</button></header><main><textarea id="code" aria-label="HTML source" spellcheck="false"></textarea><iframe id="preview" title="Live HTML preview" sandbox="allow-scripts"></iframe></main><script>
const code=document.getElementById('code'),preview=document.getElementById('preview');let timer;
try{code.value=localStorage.getItem('slipstream-editor')||'<style>body{font-family:system-ui;padding:40px;color:#261c30}h1{color:#d75f81}</style>\n<h1>Hello, Slipstream.</h1>\n<p>Make something of your own.</p>'}catch{code.value='<h1>Hello, Slipstream.</h1>'}
function run(){preview.srcdoc=code.value;try{localStorage.setItem('slipstream-editor',code.value)}catch{}}
code.oninput=()=>{clearTimeout(timer);timer=setTimeout(run,500)};document.getElementById('run').onclick=run;document.getElementById('download').onclick=()=>{const url=URL.createObjectURL(new Blob([code.value],{type:'text/html'}));const a=document.createElement('a');a.href=url;a.download='slipstream.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};run();
</script></html>
